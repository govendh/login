<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Page</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="icon" type="image/png" href="tce.jpg">

  <style>
    body, html {
      height: 100%;
      margin: 0;
      font-family: Arial, sans-serif;
    }

    .background {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-size: cover;
      background-position: center;
      animation: slider 30s linear infinite;
      z-index: -1;
    }

    @keyframes slider {
      0%   { background-image: url('1.jpg'); }
      25%  { background-image: url('2.jpg'); }
      50%  { background-image: url('3.jpg'); }
      75%  { background-image: url('4.jpg'); }
      100% { background-image: url('5.jpg'); }
    }

    .login-box {
      background: rgba(255, 255, 255, 0.8);
      padding: 20px;
      border-radius: 10px;
      width: 100%;
      max-width: 350px;
    }

    #msg {
      margin-top: 10px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="background"></div>

  <div class="d-flex justify-content-center align-items-center vh-100">
    <div class="login-box text-center">
      <h3 class="mb-3">Login</h3>
      <form onsubmit="return checkLogin()">
        <input type="text" id="loginUser" class="form-control mb-3" placeholder="Username" required>
        <input type="password" id="loginPass" class="form-control mb-3" placeholder="Password" required>
        <button type="submit" class="btn btn-primary w-100 mb-3">Login</button>
        <div class="d-flex justify-content-between">
          <a href="forgot.html">Forgot Password?</a>
          <a href="register.html">Register</a>
        </div>
        <div id="msg"></div>
      </form>
    </div>
  </div>

  <script>
    function checkLogin() {
      const user = document.getElementById("loginUser").value;
      const pass = document.getElementById("loginPass").value;
      const msg = document.getElementById("msg");

      let users = JSON.parse(localStorage.getItem("users")) || [];

      const found = users.find(u => u.username === user && u.password === pass);

      if (found) {
       // msg.innerHTML = `<span class='text-success'>✅ Welcome, ${found.fullname}!</span>`;
       window.open("welcome.html", "_blank");

        document.querySelector("form").reset();

      } else {
        msg.innerHTML = `<span class='text-danger'>❌ Invalid username or password</span>`;
        document.querySelector("form").reset();

      }

      return false; // stop form from submitting
    }
  </script>
</body>
</html>
