<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="icon" type="image/png" href="tce.jpg">
  <style>
    body {
      background: #dbeafe;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, sans-serif;
    }

    .register-box {
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
    }

    #msg {
      margin-top: 10px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="register-box">
    <h3 class="mb-4 text-center">Create Account</h3>
    <form onsubmit="return registerUser()">
      <input type="text" id="fullname" class="form-control mb-3" placeholder="Full Name" required />
      <input type="email" id="email" class="form-control mb-3" placeholder="Email" required />
      <input type="text" id="username" class="form-control mb-3" placeholder="Username" required />
      <input type="password" id="password" class="form-control mb-3" placeholder="Password" required />
      <button type="submit" class="btn btn-primary w-100">Register</button>
      <p class="mt-3 text-center">
        Already have an account? <a href="index.html">Login</a>
      </p>
      <div id="msg"></div>
    </form>
  </div>

  <script>
    function registerUser() {
      const fullname = document.getElementById("fullname").value;
      const email = document.getElementById("email").value;
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;
      const msg = document.getElementById("msg");

      let users = JSON.parse(localStorage.getItem("users")) || [];

      // Check if username already exists
      const userExists = users.some(user => user.username === username);

      if (userExists) {
        msg.innerHTML = "<span class='text-danger'>❌ Username already exists!</span>";
        document.querySelector("form").reset();

        return false;
      }

      // Add user to localStorage
      users.push({ fullname, email, username, password });
      localStorage.setItem("users", JSON.stringify(users));

      msg.innerHTML = "<span class='text-success'>✅ Registered successfully!</span>";
      document.querySelector("form").reset();

      return false; // prevent form submission
    }
  </script>
</body>
</html>
