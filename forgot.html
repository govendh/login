<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Forgot Password</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="icon" type="image/png" href="tce.jpg">
</head>
<body class="d-flex justify-content-center align-items-center vh-100" style="background-color: rgb(104, 134, 160);">

  <div class="bg-white p-4 rounded shadow" style="width: 100%; max-width: 350px;">
    <h4 class="text-center mb-3">Forgot Password</h4>

    <!-- Step 1: Email + OTP -->
    <div id="step1">
      <input type="email" id="email" class="form-control mb-2" placeholder="Enter your email">
      <button class="btn btn-warning w-100 mb-3" onclick="sendOTP()">Send OTP</button>
      
      <div id="otpBox" style="display:none;">
        <div class="text-center mb-2">Your OTP: <strong id="showOtp"></strong></div>
        <input type="text" id="enteredOtp" class="form-control mb-2" placeholder="Enter OTP">
        <button class="btn btn-primary w-100" onclick="checkOTP()">Verify OTP</button>
        <div id="otpError" class="text-danger mt-2 text-center"></div>
      </div>
    </div>

    <!-- Step 2: Reset Password -->
    <div id="step2" style="display:none;">
      <input type="password" id="newPass" class="form-control mb-2" placeholder="New Password">
      <input type="password" id="confirmPass" class="form-control mb-2" placeholder="Confirm Password">
      <button class="btn btn-success w-100" onclick="resetPassword()">Reset Password</button>
      <div id="msg" class="text-center mt-2"></div>
    </div>
  </div>

<script>
  let otp = "";

  function sendOTP() {
    const email = document.getElementById("email").value;
    if (!email) return alert("Please enter your email");

    otp = Math.floor(1000 + Math.random() * 9000); // 4-digit OTP
    document.getElementById("showOtp").innerText = otp;
    document.getElementById("otpBox").style.display = "block";
  }

  function checkOTP() {
    const entered = document.getElementById("enteredOtp").value;
    if (entered == otp) {
      document.getElementById("step1").style.display = "none";
      document.getElementById("step2").style.display = "block";
      document.getElementById("otpError").innerText = "";
    } else {
      document.getElementById("otpError").innerText = "Incorrect OTP";
    }
  }

  function resetPassword() {
    const p1 = document.getElementById("newPass").value;
    const p2 = document.getElementById("confirmPass").value;
    const msg = document.getElementById("msg");

    if (p1 === "" || p2 === "") {
      msg.innerHTML = "<span class='text-danger'>Fill both fields.</span>";
    } else if (p1 !== p2) {
      msg.innerHTML = "<span class='text-danger'>Passwords do not match.</span>";
    } else {
      msg.innerHTML = "<span class='text-success'>Password reset successful ✅</span>";
    }
  }
</script>

</body>
</html>
